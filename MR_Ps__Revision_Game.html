:root{

  --bios-deep:#071d63;   /* panel inset */

  --dim:#9fb0e6;         /* secondary text */

  --f-display:"VT323","IBM Plex Mono",ui-monospace,monospace;

}

.bin{all:unset;cursor:pointer;text-align:center;padding:16px 10px;border:2px solid var(--chrome);font-family:var(--f-display);font-size:28px;color:var(--hi);background:var(--bios)}

.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.prog div{border:1px solid var(--dim);padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--bios-deep)}
.prog b{font-family:var(--f-display);font-weight:400;font-size:26px}
.prog .done b{color:var(--ok)}.prog .todo b{color:var(--dim)}

.ov{position:absolute;inset:0;background:rgba(5,15,56,.95);display:flex;flex-direction:column;gap:12px;padding:16px;overflow:auto;border:2px solid var(--hi)}
.ov .opts{grid-template-columns:1fr}
.ov .opt{font-size:15px;padding:9px 12px}
.ov .q{font-size:17px}
.ov h2{font-size:34px}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px;align-self:center}

.pad button:active{background:var(--hi);color:var(--bios-deep)}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--dim);justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle}
@keyframes flash{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{display:inline-block;animation:flash .25s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.timer i{transition:none}}
</style>

const MODES={sort:{name:"Sort Sprint",L:"S",n:25,limit:8},quiz:{name:"Quick-Fire Quiz",L:"Q",n:20,limit:15},scen:{name:"Storage Showdown",L:"T",n:10,limit:15},help:{name:"Help Desk",L:"H",n:12,limit:20},arc:{name:"Virus Chase",L:"A",n:99,limit:20}};
const BY_L={};Object.entries(MODES).forEach(([k,v])=>BY_L[v.L]=k);
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
function chk(name,L,score,right){let h=2166136261;const s=norm(name)+"|"+L+"|"+score+"|"+right+"|bsc-y9";for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36).toUpperCase().padStart(4,"0").slice(-4)}
function makeCode(name,L,score,right){return `${L}-${score}-${right}-${chk(name,L,score,right)}`}
function loadBests(){try{return JSON.parse(localStorage.getItem("bsc_best")||"{}")}catch(e){return{}}}
function saveBest(mode,score){const b=loadBests();if(!b[mode]||score>b[mode]){b[mode]=score;try{localStorage.setItem("bsc_best",JSON.stringify(b))}catch(e){}return true}return false}
const UNLOCK_PCT=75, TEACHER_KEY="BOOT9";
function loadAcc(){try{return JSON.parse(localStorage.getItem("bsc_acc")||"{}")}catch(e){return{}}}
function saveAcc(mode,r,t){const a=loadAcc();if(!a[mode]||r/t>a[mode].r/a[mode].t){a[mode]={r,t};try{localStorage.setItem("bsc_acc",JSON.stringify(a))}catch(e){}}}
function unlockState(){
  const a=loadAcc();let r=0,t=0,done=0;
  ["sort","quiz","scen","help"].forEach(m=>{if(a[m]){r+=a[m].r;t+=a[m].t;done++}});
  const pct=t?Math.round(r/t*100):0;let forced=false;try{forced=localStorage.getItem("bsc_unlock")==="1"}catch(e){}
  return{a,done,pct,open:forced||(done===4&&pct>=UNLOCK_PCT)};
}
function bestsLine(){const b=loadBests();const parts=Object.entries(MODES).filter(([k])=>b[k]).map(([k,v])=>`${v.name} ${b[k]}`);return parts.length?`<p class="note">Your best scores on this computer: ${esc(parts.join(" · "))}</p>`:""}

/* ---------- build rounds ---------- */
function start(mode){
  let rounds=[];
  if(mode==="sort"){
    SORTS.forEach(s=>shuffle(s.items).slice(0,5).forEach(it=>rounds.push({kind:"sort",set:s,item:it})));
    // keep sets grouped but shuffled order of sets
    const bySet={};rounds.forEach(r=>(bySet[r.set.title]=bySet[r.set.title]||[]).push(r));
    rounds=shuffle(Object.values(bySet)).flat();
  } else {
    const bank={quiz:QUIZ,scen:SCEN,help:HELP}[mode];
    const n=MODES[mode].n;
    const order={B:0,S:1,G:2,P:3};
    const take=(t,k)=>shuffle(bank.filter(q=>q[0]===t)).slice(0,k);
    let pick=mode==="quiz"?[...take("B",5),...take("S",6),...take("G",6),...take("P",3)]
            :mode==="help"?[...take("B",3),...take("S",4),...take("G",3),...take("P",2)]:bank.slice();
    pick.sort((a,b)=>order[a[0]]-order[b[0]]);
    rounds=pick.slice(0,n).map(q=>{const opts=shuffle(q[2].map((t,i)=>({t,ok:i===q[3]})));return{kind:"mc",tier:q[0],q:q[1],opts,why:q[4]}});
  }
  G={mode,rounds,i:0,score:0,streak:0,best:0,right:0,missed:[],limit:MODES[mode].limit};
  next();
}

function hud(){
  const r=G.rounds[G.i];
  return `<div class="hud"><span>Q <span class="v">${G.i+1}/${G.rounds.length}</span></span><span>Score <span class="v pop" id="sc">${G.score}</span></span><span>Streak <span class="v">${G.streak}</span></span></div>
  <div class="timer" id="tm"><i id="tb"></i></div>`;
}

function runTimer(onOut){
  clearTimer();const total=G.limit*1000;const t0=Date.now();
  tick=setInterval(()=>{const left=Math.max(0,total-(Date.now()-t0));G.left=left/1000;
    const tb=$("#tb");if(tb){tb.style.width=(left/total*100)+"%";$("#tm").classList.toggle("low",left<total*.3)}
    if(left<=0){clearTimer();onOut()}},100);
  G.left=G.limit;
}

function next(){
  if(G.i>=G.rounds.length)return results();
  const r=G.rounds[G.i];G.locked=false;
  if(r.kind==="sort"){
    app.innerHTML=hud()+`<div class="card"><span class="tag t-S">${esc(r.set.title)}</span>
      <div class="item">${esc(r.item[0])}</div>
      <div class="bins">${r.set.bins.map((b,i)=>`<button class="bin" data-i="${i}">${esc(b)}<small>key ${i+1}</small></button>`).join("")}</div>
      <div class="fb" id="fb">Pick a category.</div></div>
      <div class="row"><button class="btn" id="nx" hidden>Next ▸</button><button class="btn ghost" id="qt">Quit</button></div>`;
    const btns=[...app.querySelectorAll(".bin")];
    btns.forEach(b=>b.onclick=()=>answer(+b.dataset.i,btns));
    runTimer(()=>answer(-1,btns));
  } else {
    app.innerHTML=hud()+`<div class="card"><span class="tag t-${r.tier}">${TIERS[r.tier]}</span>
      <p class="q">${esc(r.q)}</p>
      <div class="opts">${r.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
      <div class="fb" id="fb"></div></div>
      <div class="row"><button class="btn" id="nx" hidden>Next ▸</button><button class="btn ghost" id="qt">Quit</button></div>`;
    const btns=[...app.querySelectorAll(".opt")];
    btns.forEach(b=>b.onclick=()=>answer(+b.dataset.i,btns));
    runTimer(()=>answer(-1,btns));
  }
  $("#nx").onclick=()=>{G.i++;next()};
  $("#qt").onclick=menu;
  keyHandler=e=>{
    if(e.key==="Escape"){menu();return}
    if(G&&G.locked&&e.key==="Enter"){e.preventDefault();G.i++;next();return}
    const n=parseInt(e.key,10);const btns=[...app.querySelectorAll(".bin,.opt")];
    if(n>=1&&n<=btns.length&&!G.locked)answer(n-1,btns);
  };
}

function answer(i,btns){
  if(G.locked)return;G.locked=true;clearTimer();
  const r=G.rounds[G.i];
  const correctIdx=r.kind==="sort"?r.item[1]:r.opts.findIndex(o=>o.ok);
  const correctText=r.kind==="sort"?r.set.bins[correctIdx]:r.opts[correctIdx].t;
  const why=r.kind==="sort"?r.item[2]:r.why;
  btns.forEach(b=>b.disabled=true);
  btns[correctIdx].classList.add("right");
  const fb=$("#fb");
  if(i===correctIdx){
    G.streak++;G.best=Math.max(G.best,G.streak);G.right++;
    const speed=Math.round(50*(G.left/G.limit));const bonus=Math.min(G.streak-1,5)*10;
    const tierBonus=r.tier?{B:0,S:10,G:20,P:40}[r.tier]:0;
    const pts=100+speed+bonus+tierBonus;G.score+=pts;
    fb.innerHTML=`<b class="g">Correct +${pts}</b>${G.streak>2?` <span class="combo">×${G.streak} streak</span>`:""}<br>${esc(why)}`;
  } else {
    G.streak=0;if(i>=0)btns[i].classList.add("wrong");
    G.missed.push((r.kind==="sort"?r.item[0]+" → ":r.q+" → ")+correctText);
    fb.innerHTML=`<b class="r">${i<0?"Time's up.":"Not quite."}</b> Answer: <b>${esc(correctText)}</b>. ${esc(why)}`;
  }
  const sc=$("#sc");if(sc){sc.textContent=G.score;sc.classList.remove("pop");void sc.offsetWidth;sc.classList.add("pop")}
  $("#nx").hidden=false;$("#nx").focus();
}

function results(){
  clearTimer();
  const pct=Math.round(G.right/G.rounds.length*100);
  const tier=pct>=85?"P":pct>=65?"G":pct>=40?"S":"B";
  const tips={B:"Look again at the categories you missed, then try once more.",S:"Solid. Focus on the items in the review list.",G:"Strong work. Try a different game to chase Platinum.",P:"Platinum. Challenge the person next to you to beat this."};
  const code=makeCode(player,MODES[G.mode].L,G.score,G.right);
  const wasOpen=unlockState().open;
  const pb=saveBest(G.mode,G.score);saveAcc(G.mode,G.right,G.rounds.length);
  const nowOpen=!wasOpen&&unlockState().open;
  app.innerHTML=`<div class="section-label">${esc(MODES[G.mode].name)} complete · ${esc(player)}</div>
  <div class="rank t-${tier}">${TIERS[tier].toUpperCase()}</div>
  <div class="hud"><span>Score <span class="v">${G.score}</span></span><span>Correct <span class="v">${G.right}/${G.rounds.length}</span></span><span>Best streak <span class="v">${G.best}</span></span>${pb?`<span class="v">New personal best</span>`:""}</div>
  <p>${tips[tier]}</p>
  ${nowOpen?`<p class="unlock-msg">BONUS GAME UNLOCKED: Virus Chase is now open on the main menu.</p>`:(()=>{const u=unlockState();return u.open?"":`<p class="note">Virus Chase progress: ${u.done}/4 games played · ${u.pct}% correct (needs all 4 and ${UNLOCK_PCT}%+).</p>`})()}
  <div class="section-label">Your score code · submit it in your teacher's form</div>
  <div class="coderow"><span class="code" id="cd">${code}</span><button class="btn ghost" id="cp">Copy code</button></div>
  <p class="note">Submit the same name you typed here (${esc(player)}). Codes are locked to your name and score, so edited codes are flagged.</p>
  ${G.missed.length?`<div class="section-label">Revise these before Monday</div><div class="review">${G.missed.map(m=>`<div>${esc(m)}</div>`).join("")}</div>`:`<p class="t-P">No mistakes. Perfect boot.</p>`}
  <div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Choose another game</button></div>`;
  $("#again").onclick=()=>start(G.mode);$("#home").onclick=menu;

    try{navigator.clipboard.writeText(code).then(done,sel)}catch(e){sel()}};
  keyHandler=e=>{if(e.key==="Escape")menu()};
}

function render(text){
  const re=/\b([SQTHA])-(\d{1,5})-(\d{1,2})-([A-Z0-9]{4})\b/i;
  const people={},bad=[];
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;const m=line.match(re);
    if(!m){if(!/name|code/i.test(line))bad.push(line.trim());return}
    const name=line.replace(m[0],"").replace(/[\t,;"]+/g," ").trim()||"Unknown";
    const L=m[1].toUpperCase(),score=+m[2],right=+m[3],mode=BY_L[L];
    const ok=chk(name,L,score,right)===m[4].toUpperCase()&&right<=MODES[mode].n;
    if(!ok){bad.push(`${name}: ${m[0].toUpperCase()} (code does not match this name or was edited)`);return}
    const k=norm(name);const p=people[k]||(people[k]={name,best:{},right:{}});
    if(!p.best[mode]||score>p.best[mode]){p.best[mode]=score;p.right[mode]=right}
  });
  const list=Object.values(people).map(p=>{p.total=Object.values(p.best).reduce((a,b)=>a+b,0);
    const qm=Object.keys(p.best).filter(m=>m!=="arc");
    const tot=qm.reduce((a,m)=>a+MODES[m].n,0),r=qm.reduce((a,m)=>a+p.right[m],0);
    p.pct=tot?Math.round(r/tot*100):0;p.tier=p.pct>=85?"P":p.pct>=65?"G":p.pct>=40?"S":"B";return p}).sort((a,b)=>b.total-a.total);
  const cell=(p,m)=>p.best[m]?`${p.best[m]}`:"–";
  $("#board").innerHTML=list.length?`
  <div class="tbl-wrap"><table class="lb"><thead><tr><th>#</th><th>Pupil</th><th>Sort</th><th>Quiz</th><th>Storage</th><th>Help Desk</th><th>Virus Chase</th><th>Total</th><th>Accuracy</th></tr></thead><tbody>
  ${list.map((p,i)=>`<tr class="${i<3?"top"+(i+1):""}"><td class="pos">${i+1}</td><td>${esc(p.name)}</td><td class="n">${cell(p,"sort")}</td><td class="n">${cell(p,"quiz")}</td><td class="n">${cell(p,"scen")}</td><td class="n">${cell(p,"help")}</td><td class="n">${cell(p,"arc")}</td><td class="n"><b>${p.total}</b></td><td class="t-${p.tier}">${TIERS[p.tier]} · ${p.pct}%</td></tr>`).join("")}
  </tbody></table></div>
  <p class="note">Total adds each pupil's best score in every game they played. Accuracy across those games sets the tier. Pupils at Bronze are your priority for Monday.</p>`
  :`<p class="note">No valid score codes yet. Paste responses above, or load the example rows to see how it works.</p>`;
  if(bad.length)$("#board").insertAdjacentHTML("beforeend",`<div class="section-label">Flagged · check these</div><div class="review">${bad.map(b=>`<div>${esc(b)}</div>`).join("")}</div>`);
}

/* ---------- Virus Chase (arcade) ---------- */
const MAZE=["###################","#........#........#","#o##.###.#.###.##o#","#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.### # ###.####","   #.#   E   #.#   ","####.# ##### #.####","    .  #   #  .    ","####.# ##### #.####","   #.#       #.#   ","####.# ##### #.####","#........#........#","#.##.###.#.###.##.#","#o.#.....P.....#.o#","##.#.#.#####.#.#.##","#....#...#...#....#","#.######.#.######.#","#.................#","###################"];
const VOID=new Set(["7,0","7,1","7,2","7,16","7,17","7,18","11,0","11,1","11,2","11,16","11,17","11,18","9,8","9,9","9,10"]);
const VCOL=["#ff5d73","#ff9f43","#d980ff","#ff6fb5","#f25f3a","#c2ff5c","#ff4fd8","#ffb3b3"];

function arcade(){
  clearTimer();G=null;
  const COLS=19,ROWS=MAZE.length,T=24,RAMP=8,MAXV=8;
  const DIRS={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
  app.innerHTML=`<div class="hud" id="ahud"></div>
  <div class="arena"><canvas id="cv" aria-label="Virus Chase maze game"></canvas><div class="ov" id="ov" hidden></div></div>
  <div class="legend"><span><i style="background:#ffe14d"></i>Data bit +10</span><span><i style="background:#5ee08a;border-radius:50%"></i>Antivirus: zap viruses for 6 s</span><span><i style="background:#ff5d73;border-radius:50%"></i>Virus: touch one and you must answer to respawn</span></div>
  <div class="pad"><button class="u" data-d="u" aria-label="Up">▲</button><button class="l" data-d="l" aria-label="Left">◀</button><button class="d" data-d="d" aria-label="Down">▼</button><button class="r" data-d="r" aria-label="Right">▶</button></div>
  <div class="row"><button class="btn ghost" id="qt">Quit to menu</button></div>`;
  const cv=$("#cv"),ov=$("#ov"),ctx=cv.getContext("2d");
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=COLS*T*dpr;cv.height=ROWS*T*dpr;ctx.scale(dpr,dpr);
  let grid,dotsLeft,start,spawn;
  function loadMaze(){grid=MAZE.map(r=>r.split(""));dotsLeft=0;
    grid.forEach((r,y)=>r.forEach((c,x)=>{if(c==="P"){start={x,y};r[x]=" "}if(c==="E"){spawn={x,y};r[x]=" "}if(c==="."||c==="o")dotsLeft++}))}
  loadMaze();
  const wrapX=x=>(x+COLS)%COLS;
  const walk=(x,y)=>y>=0&&y<ROWS&&grid[y][wrapX(x)]!=="#"&&!VOID.has(y+","+wrapX(x));
  const S={score:0,lives:3,level:1,time:0,correct:0,asked:0,missed:[],state:"ready",fright:0,inv:0,slowT:0,nextSpawn:20,queue:shuffle([...QUIZ,...SCEN,...HELP])};
  const pc={x:start.x,y:start.y,tx:start.x,ty:start.y,dir:null,next:null};
  const vs=[];
  function addVirus(){vs.push({x:spawn.x,y:spawn.y,tx:spawn.x,ty:spawn.y,dir:null,dead:0,c:VCOL[vs.length%VCOL.length]})}
  addVirus();addVirus();

  function step(e,speed,dt,decide){
    let dist=speed*dt,g=0;
    while(dist>1e-6&&g++<6){
      if(e.x===e.tx&&e.y===e.ty){
        decide(e);if(!e.dir)return;
        const nx=e.x+e.dir.x,ny=e.y+e.dir.y;
        if(!walk(nx,ny)){e.dir=null;return}
        e.tx=nx;e.ty=ny;
      }
      const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.abs(dx)+Math.abs(dy);
      if(d<=dist){e.x=e.tx;e.y=e.ty;dist-=d;if(e.x<0)e.x=e.tx=COLS-1;else if(e.x>=COLS)e.x=e.tx=0}
      else{e.x+=Math.sign(dx)*dist;e.y+=Math.sign(dy)*dist;dist=0}
    }
  }
  function playerDecide(e){
    const c=grid[e.y][e.x];
    if(c==="."){grid[e.y][e.x]=" ";S.score+=10;dotsLeft--}
    else if(c==="o"){grid[e.y][e.x]=" ";S.score+=50;dotsLeft--;S.fright=6;vs.forEach(v=>{if(v.dir&&(v.x!==v.tx||v.y!==v.ty)){v.tx-=v.dir.x;v.ty-=v.dir.y;v.dir={x:-v.dir.x,y:-v.dir.y}}})}
    if(dotsLeft<=0){levelUp();return}
    if(e.next&&walk(e.x+e.next.x,e.y+e.next.y))e.dir=e.next;
    else if(!(e.dir&&walk(e.x+e.dir.x,e.y+e.dir.y)))e.dir=null;
  }
  function virusDecide(e){
    let opts=Object.values(DIRS).filter(d=>walk(e.x+d.x,e.y+d.y)&&!(e.dir&&d.x===-e.dir.x&&d.y===-e.dir.y));
    if(!opts.length)opts=Object.values(DIRS).filter(d=>walk(e.x+d.x,e.y+d.y));
    const dd=d=>(e.x+d.x-pc.x)**2+(e.y+d.y-pc.y)**2;
    const chase=Math.min(.9,.45+S.time*.004+S.level*.05);
    let pick;
    if(S.fright>0)pick=Math.random()<.7?opts.reduce((a,b)=>dd(b)>dd(a)?b:a):opts[Math.random()*opts.length|0];
    else pick=Math.random()<chase?opts.reduce((a,b)=>dd(b)<dd(a)?b:a):opts[Math.random()*opts.length|0];
    e.dir=pick;
  }
  function virusSpeed(){
    const base=Math.min(4.7,2.7+S.time*.012+(S.level-1)*.3);
    const ramp=S.slowT<RAMP?.35+.65*(S.slowT/RAMP):1;
    return base*ramp*(S.fright>0?.55:1);
  }

  function update(dt){
    S.time+=dt;S.slowT+=dt;
    if(S.fright>0)S.fright=Math.max(0,S.fright-dt);
    if(S.inv>0)S.inv=Math.max(0,S.inv-dt);
    S.nextSpawn-=dt;
    if(S.nextSpawn<=0){if(vs.length<MAXV)addVirus();S.nextSpawn=Math.max(10,20-S.level*2)}
    step(pc,5,dt,playerDecide);
    if(S.state!=="play")return;
    const vsp=virusSpeed();
    vs.forEach(v=>{
      if(v.dead>0){v.dead-=dt;return}
      step(v,vsp,dt,virusDecide);
      if(Math.abs(v.x-pc.x)+Math.abs(v.y-pc.y)<.7){
        if(S.fright>0){S.score+=200;v.dead=4;v.x=v.tx=spawn.x;v.y=v.ty=spawn.y;v.dir=null}
        else if(S.inv<=0&&S.state==="play")caught();
      }
    });
    hudUpdate();
  }

  let lastHud="";
  function hudUpdate(){
    const slowed=S.slowT<RAMP;
    const h=`<span>Score <span class="v">${S.score}</span></span><span>Lives <span class="v">${"■".repeat(S.lives)||"0"}</span></span><span>Level <span class="v">${S.level}</span></span><span>Viruses <span class="v">${vs.length}</span></span><span>${S.fright>0?`<span style="color:var(--ok)">ANTIVIRUS ${Math.ceil(S.fright)}s</span>`:slowed?`<span style="color:var(--plat)">Viruses slowed</span>`:`Next virus <span class="v">${Math.max(0,Math.ceil(S.nextSpawn))}s</span>`}</span>`;
    if(h!==lastHud){$("#ahud").innerHTML=h;lastHud=h}
  }

  function show(html){ov.innerHTML=html;ov.hidden=false}
  function hide(){ov.hidden=true;ov.innerHTML=""}

  function caught(){
    S.state="question";pc.dir=null;pc.next=null;
    if(!S.queue.length)S.queue=shuffle([...QUIZ,...SCEN,...HELP]);
    const q=S.queue.pop();S.asked++;
    const opts=shuffle(q[2].map((t,i)=>({t,ok:i===q[3]})));
    show(`<h2 style="color:var(--bad)">Virus detected</h2>
      <p class="note">Answer correctly to restore your system. A wrong answer costs a life.</p>
      <span class="tag t-${q[0]}">${TIERS[q[0]]}</span>
      <p class="q">${esc(q[1])}</p>
      <div class="timer" id="atm"><i id="atb"></i></div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
      <div class="fb" id="afb"></div>
      <div class="row"><button class="btn" id="go" hidden>Respawn ▸</button></div>`);
    const btns=[...ov.querySelectorAll(".opt")];let done=false;
    const answer=i=>{
      if(done)return;done=true;clearTimer();
      const ci=opts.findIndex(o=>o.ok);btns.forEach(b=>b.disabled=true);btns[ci].classList.add("right");
      if(i===ci){S.correct++;S.score+=100;$("#afb").innerHTML=`<b class="g">Correct +100. System restored.</b> ${esc(q[4])}`}
      else{if(i>=0)btns[i].classList.add("wrong");S.lives--;S.missed.push(q[1].replace(/^TICKET: /,"")+" → "+opts[ci].t);
        $("#afb").innerHTML=`<b class="r">${i<0?"Time's up.":"Not quite."} −1 life.</b> Answer: <b>${esc(opts[ci].t)}</b>. ${esc(q[4])}`}
      const go=$("#go");go.hidden=false;if(S.lives<=0)go.textContent="See results ▸";go.focus();
      go.onclick=()=>S.lives<=0?gameOver():respawn();
      S.awaiting=true;
    };
    S.answer=answer;S.awaiting=false;
    btns.forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    const total=20000,t0=Date.now();
    clearTimer();tick=setInterval(()=>{const left=Math.max(0,total-(Date.now()-t0));const b=$("#atb");if(b){b.style.width=(left/total*100)+"%";$("#atm").classList.toggle("low",left<6000)}if(left<=0)answer(-1)},100);
  }
  function respawn(){
    hide();S.awaiting=false;S.answer=null;
    pc.x=pc.tx=start.x;pc.y=pc.ty=start.y;pc.dir=null;pc.next=null;
    vs.forEach(v=>{if(Math.abs(v.x-start.x)+Math.abs(v.y-start.y)<6){v.x=v.tx=spawn.x;v.y=v.ty=spawn.y;v.dir=null}});
    S.slowT=0;S.inv=2.5;S.state="play";
  }
  function levelUp(){
    S.level++;S.score+=500;loadMaze();
    S.state="level";pc.dir=null;pc.next=null;
    vs.forEach(v=>{v.x=v.tx=spawn.x;v.y=v.ty=spawn.y;v.dir=null;v.dead=0});
    show(`<h2>Level ${S.level - 1} cleared</h2><p>+500 bonus. The maze is refilled, the viruses get faster and new ones arrive sooner.</p><div class="row"><button class="btn" id="go">Start level ${S.level} ▸</button></div>`);
    S.awaiting=true;const go=$("#go");go.focus();go.onclick=respawn;
  }
  function gameOver(){
    S.state="over";clearTimer();
    const right=Math.min(99,S.correct);
    const code=makeCode(player,"A",S.score,right);
    const pb=saveBest("arc",S.score);
    app.innerHTML=`<div class="section-label">Virus Chase · game over · ${esc(player)}</div>
    <div class="big">${S.score} points</div>
    <div class="hud"><span>Level <span class="v">${S.level}</span></span><span>Survived <span class="v">${Math.floor(S.time/60)}m ${String(Math.floor(S.time%60)).padStart(2,"0")}s</span></span><span>Respawn questions <span class="v">${S.correct}/${S.asked}</span></span>${pb?`<span class="v">New personal best</span>`:""}</div>
    <div class="section-label">Your score code · submit it in your teacher's form</div>
    <div class="coderow"><span class="code" id="cd">${code}</span><button class="btn ghost" id="cp">Copy code</button></div>
    ${S.missed.length?`<div class="section-label">Revise these before Monday</div><div class="review">${S.missed.map(m=>`<div>${esc(m)}</div>`).join("")}</div>`:`<p class="t-P">Every respawn question right.</p>`}
    <div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Back to menu</button></div>`;
    $("#again").onclick=arcade;$("#home").onclick=menu;
    $("#cp").onclick=()=>{const b=$("#cp");const sel=()=>{const r=document.createRange();r.selectNodeContents($("#cd"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected: press Ctrl+C"};try{navigator.clipboard.writeText(code).then(()=>b.textContent="Copied",sel)}catch(e){sel()}};
    keyHandler=e=>{if(e.key==="Escape")menu()};
  }

  function setDir(k){
    const nd=DIRS[k];if(!nd)return;
    if(S.state==="ready"){hide();S.state="play"}
    if(S.state!=="play")return;
    pc.next=nd;
    if(pc.dir&&nd.x===-pc.dir.x&&nd.y===-pc.dir.y&&!(pc.x===pc.tx&&pc.y===pc.ty)){pc.tx+=nd.x;pc.ty+=nd.y;pc.dir=nd}
  }
  const KEYS={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",w:"u",s:"d",a:"l",d:"r",W:"u",S:"d",A:"l",D:"r"};
  keyHandler=e=>{
    if(e.key==="Escape"){menu();return}
    if(KEYS[e.key]&&S.state!=="question"){e.preventDefault();setDir(KEYS[e.key]);return}
    if(S.state==="question"&&!S.awaiting){const n=parseInt(e.key,10);if(n>=1&&n<=4&&S.answer)S.answer(n-1)}
  };
  app.querySelectorAll(".pad button").forEach(b=>b.addEventListener("pointerdown",ev=>{ev.preventDefault();setDir(b.dataset.d)}));
  let sw=null;
  cv.addEventListener("pointerdown",e=>{sw={x:e.clientX,y:e.clientY}});
  cv.addEventListener("pointerup",e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(S.state==="ready"){hide();S.state="play"}return}
    setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"))});
  $("#qt").onclick=menu;

  /* drawing */
  function draw(now){
    ctx.fillStyle="#050f38";ctx.fillRect(0,0,COLS*T,ROWS*T);
    // walls as circuit traces
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      if(grid[y][x]!=="#")continue;
      const px=x*T,py=y*T;
      ctx.fillStyle="#0f2a86";ctx.fillRect(px,py,T,T);
      ctx.strokeStyle="#7f9bff";ctx.lineWidth=2;ctx.beginPath();
      const open=(nx,ny)=>nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&grid[ny][nx]!=="#"&&!VOID.has(ny+","+nx);
      if(open(x,y-1)){ctx.moveTo(px,py+1);ctx.lineTo(px+T,py+1)}
      if(open(x,y+1)){ctx.moveTo(px,py+T-1);ctx.lineTo(px+T,py+T-1)}
      if(open(x-1,y)){ctx.moveTo(px+1,py);ctx.lineTo(px+1,py+T)}
      if(open(x+1,y)){ctx.moveTo(px+T-1,py);ctx.lineTo(px+T-1,py+T)}
      ctx.stroke();
      if((x*7+y*3)%11===0){ctx.fillStyle="#3c5fd6";ctx.fillRect(px+T/2-2,py+T/2-2,4,4)}
    }
    // dots
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      const c=grid[y][x],cx=x*T+T/2,cy=y*T+T/2;
      if(c==="."){ctx.fillStyle="#ffe14d";ctx.fillRect(cx-2.5,cy-2.5,5,5)}
      else if(c==="o"){const r=7+Math.sin(now/180)*1.2;ctx.fillStyle="#5ee08a";ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
        ctx.fillStyle="#04301a";ctx.font="bold 8px IBM Plex Mono, monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("AV",cx,cy+.5)}
    }
    // viruses
    vs.forEach(v=>{
      if(v.dead>0)return;
      const cx=v.x*T+T/2,cy=v.y*T+T/2;
      const scared=S.fright>0,blink=scared&&S.fright<2&&Math.floor(now/150)%2;
      const col=scared?(blink?"#ffffff":"#8fb4ff"):v.c;
      ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<8;i++){const a=i*Math.PI/4+now/600;ctx.moveTo(cx+Math.cos(a)*7,cy+Math.sin(a)*7);ctx.lineTo(cx+Math.cos(a)*11,cy+Math.sin(a)*11)}
      ctx.stroke();
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,7.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#050f38";ctx.fillRect(cx-4,cy-2,2.5,3);ctx.fillRect(cx+1.5,cy-2,2.5,3);
      if(scared){ctx.fillRect(cx-4,cy+3,8,1.5)}
    });
    // player: a data packet chip
    if(!(S.inv>0&&Math.floor(now/120)%2)){
      const cx=pc.x*T+T/2,cy=pc.y*T+T/2;
      ctx.strokeStyle="#ffe14d";ctx.lineWidth=1.5;ctx.beginPath();
      for(let i=-1;i<=1;i++){ctx.moveTo(cx+i*4,cy-11);ctx.lineTo(cx+i*4,cy+11);ctx.moveTo(cx-11,cy+i*4);ctx.lineTo(cx+11,cy+i*4)}
      ctx.stroke();
      ctx.fillStyle="#ffe14d";ctx.fillRect(cx-8,cy-8,16,16);
      ctx.fillStyle="#071d63";ctx.fillRect(cx-5,cy-5,10,10);
      const d=pc.dir||pc.next||DIRS.r;
      ctx.fillStyle="#ffe14d";ctx.beginPath();
      ctx.moveTo(cx+d.x*4,cy+d.y*4);ctx.lineTo(cx-d.x*2+d.y*3,cy-d.y*2+d.x*3);ctx.lineTo(cx-d.x*2-d.y*3,cy-d.y*2-d.x*3);ctx.closePath();ctx.fill();
    }
  }

  let last=performance.now();
  function frame(now){
    if(!cv.isConnected)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(S.state==="play")update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  hudUpdate();
  show(`<h2>Virus Chase</h2>
    <p>You are a data packet inside the motherboard. Collect every data bit to clear the level.</p>
    <ul class="steps"><li>Move with the arrow keys, WASD, the on-screen pad or by swiping.</li><li>Green <b>AV</b> chips switch on antivirus for 6 seconds, so you can zap viruses for +200.</li><li>Caught by a virus? Answer a question to respawn. Wrong answers cost a life, and you have 3.</li><li>A new virus arrives every 20 seconds. After you respawn they slow right down, then speed back up.</li></ul>
    <div class="row"><button class="btn" id="go">Start ▸</button></div>`);
  $("#go").onclick=()=>{hide();S.state="play"};$("#go").focus();
  requestAnimationFrame(frame);
}

document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;keyHandler&&keyHandler(e)});
menu();
})();
</script>

</body></html>
